# Training Configuration
# =====================

# Data configuration
data_path: "data/"
target_column: "target"

# Model configuration
model_type: "random_forest"

model_params:
  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 5
    min_samples_leaf: 2
    random_state: 42
    n_jobs: -1
  
  gradient_boosting:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1
    subsample: 0.8
    random_state: 42
  
  logistic_regression:
    max_iter: 1000
    random_state: 42
    C: 1.0

# Training settings
output_dir: "models/"
test_size: 0.2
random_state: 42

# MLflow tracking
mlflow_tracking_uri: null