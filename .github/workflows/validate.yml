name: Validate Model

on:
  workflow_run:
    workflows: ["Train Model"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      model_version:
        description: 'Model version to validate'
        required: true

env:
  PYTHON_VERSION: '3.9'
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

jobs:
  get-model-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Get model version from training
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.model_version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          fi

  validate-accuracy:
    needs: get-model-version
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.validate.outputs.passed }}
      metrics: ${{ steps.validate.outputs.metrics }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download model
        uses: actions/download-artifact@v4
        with:
          name: model-${{ needs.get-model-version.outputs.version }}
          path: models/${{ needs.get-model-version.outputs.version }}/

      - name: Run accuracy validation
        id: validate
        run: |
          python -m src.validation.accuracy_gate \
            --config configs/validation_config.yaml \
            --model-path models/${{ needs.get-model-version.outputs.version }}/model.pkl \
            --data-path data/test/ \
            --output results/accuracy_results.json
          
          if [ $? -eq 0 ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -f "results/accuracy_results.json" ]; then
            METRICS=$(cat results/accuracy_results.json)
            echo "metrics=$METRICS" >> $GITHUB_OUTPUT
          fi

      - name: Upload accuracy results
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-results-${{ needs.get-model-version.outputs.version }}
          path: results/accuracy_results.json

  validate-fairness:
    needs: get-model-version
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.validate.outputs.passed }}
      metrics: ${{ steps.validate.outputs.metrics }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download model
        uses: actions/download-artifact@v4
        with:
          name: model-${{ needs.get-model-version.outputs.version }}
          path: models/${{ needs.get-model-version.outputs.version }}/

      - name: Run fairness validation
        id: validate
        run: |
          python -m src.validation.fairness_gate \
            --config configs/validation_config.yaml \
            --model-path models/${{ needs.get-model-version.outputs.version }}/model.pkl \
            --data-path data/test/ \
            --output results/fairness_results.json
          
          if [ $? -eq 0 ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -f "results/fairness_results.json" ]; then
            METRICS=$(cat results/fairness_results.json)
            echo "metrics=$METRICS" >> $GITHUB_OUTPUT
          fi

      - name: Upload fairness results
        uses: actions/upload-artifact@v4
        with:
          name: fairness-results-${{ needs.get-model-version.outputs.version }}
          path: results/fairness_results.json

  validate-data-quality:
    needs: get-model-version
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.validate.outputs.passed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data quality validation
        id: validate
        run: |
          python -m src.validation.data_quality_gate \
            --config configs/validation_config.yaml \
            --data-path data/test/ \
            --output results/data_quality_results.json
          
          if [ $? -eq 0 ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi

  validate-performance:
    needs: get-model-version
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.validate.outputs.passed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download model
        uses: actions/download-artifact@v4
        with:
          name: model-${{ needs.get-model-version.outputs.version }}
          path: models/${{ needs.get-model-version.outputs.version }}/

      - name: Run performance validation
        id: validate
        run: |
          python -m src.validation.performance_gate \
            --config configs/validation_config.yaml \
            --model-path models/${{ needs.get-model-version.outputs.version }}/model.pkl \
            --output results/performance_results.json
          
          if [ $? -eq 0 ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi

  aggregate-results:
    needs: [get-model-version, validate-accuracy, validate-fairness, validate-data-quality, validate-performance]
    runs-on: ubuntu-latest
    outputs:
      all_passed: ${{ steps.aggregate.outputs.all_passed }}
      report: ${{ steps.aggregate.outputs.report }}
    steps:
      - name: Aggregate validation results
        id: aggregate
        run: |
          ACCURACY_PASSED="${{ needs.validate-accuracy.outputs.passed }}"
          FAIRNESS_PASSED="${{ needs.validate-fairness.outputs.passed }}"
          DATA_QUALITY_PASSED="${{ needs.validate-data-quality.outputs.passed }}"
          PERFORMANCE_PASSED="${{ needs.validate-performance.outputs.passed }}"
          
          echo "Accuracy: $ACCURACY_PASSED"
          echo "Fairness: $FAIRNESS_PASSED"
          echo "Data Quality: $DATA_QUALITY_PASSED"
          echo "Performance: $PERFORMANCE_PASSED"
          
          if [ "$ACCURACY_PASSED" = "true" ] && \
             [ "$FAIRNESS_PASSED" = "true" ] && \
             [ "$DATA_QUALITY_PASSED" = "true" ] && \
             [ "$PERFORMANCE_PASSED" = "true" ]; then
            echo "all_passed=true" >> $GITHUB_OUTPUT
          else
            echo "all_passed=false" >> $GITHUB_OUTPUT
          fi
          
          REPORT="{
            \"model_version\": \"${{ needs.get-model-version.outputs.version }}\",
            \"accuracy\": ${{ needs.validate-accuracy.outputs.passed == 'true' }},
            \"fairness\": ${{ needs.validate-fairness.outputs.passed == 'true' }},
            \"data_quality\": ${{ needs.validate-data-quality.outputs.passed == 'true' }},
            \"performance\": ${{ needs.validate-performance.outputs.passed == 'true' }}
          }"
          echo "report=$REPORT" >> $GITHUB_OUTPUT

      - name: Save validation report
        run: |
          echo '${{ steps.aggregate.outputs.report }}' > results/validation_report.json

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ needs.get-model-version.outputs.version }}
          path: results/validation_report.json

  trigger-promotion:
    needs: [get-model-version, aggregate-results]
    if: needs.aggregate-results.outputs.all_passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger promotion workflow
        uses: peter-evans/repository-dispatch@v2
        with:
          event-type: promote-model
          client-payload: '{"version": "${{ needs.get-model-version.outputs.version }}"}'

  notify-results:
    needs: [get-model-version, aggregate-results]
    runs-on: ubuntu-latest
    steps:
      - name: Send validation report
        run: |
          ALL_PASSED="${{ needs.aggregate-results.outputs.all_passed }}"
          VERSION="${{ needs.get-model-version.outputs.version }}"
          
          if [ "$ALL_PASSED" = "true" ]; then
            echo "✅ Model $VERSION passed all validation gates"
            echo "Triggering promotion to production..."
          else
            echo "❌ Model $VERSION failed validation"
            echo "Promotion blocked. Check validation results for details."
          fi